[project]
name = "robot-chess-commentator"
version = "0.1.0"
description = "A Reachy Mini robot that watches a physical chess game, reads the board from one photo, and commentates out loud."
readme = "README.md"
authors = [{ name = "Felix Fabricius" }]
requires-python = ">=3.12"
# GPL-3.0-or-later is required, not chosen: python-chess is GPL-3.0-or-later and
# chess.Board.legal_moves is load-bearing for the move-ranking core. See README.
# The bundled model weights under weights/ are Apache-2.0 and are not part of this
# distribution; see weights/README.md.
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "anthropic>=0.109.1",
    "hydra-core>=1.3.4",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.0",
    "numpy>=2.4.6",
    "omegaconf>=2.3.1",
    "opencv-python>=4.13.0.92",
    "polars>=1.42.1",
    "pygame>=2.6.0",
    "python-chess>=1.999",
    "python-dotenv>=1.2.2",
    "safetensors>=0.8.0",
    "torch>=2.12.1",
    "torchvision>=0.27.1",
    "wandb>=0.28.0",
]

[project.urls]
Homepage = "https://github.com/felixfabricius/robot-chess-commentator"
Repository = "https://github.com/felixfabricius/robot-chess-commentator"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.14",
]
robot = [
    "kokoro>=0.9.4",
    "reachy-mini[mujoco]>=1.8.4",
    "scipy>=1.18.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The import name is deliberately shorter than the distribution name, so hatchling cannot infer
# the package directory from `project.name`. Keeping this explicit is what lets the directory and
# the distribution be renamed independently instead of having to move in lockstep.
[tool.hatch.build.targets.wheel]
packages = ["src/chess_commentator"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
# Ruff's default rule set. F (pyflakes) is the one that earns its keep here: F401/F811/F821 are
# exactly the residue that a package rename and a module split leave behind.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# demo.py is a `#%%` cell script, so its first cell is a toggle and the imports land in the
# second one. E402 (import not at top of file) is wrong about that by construction.
"demo/demo.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
