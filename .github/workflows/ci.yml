name: CI

# CI is triggered on any push to main,
# any pull request (any branch), and 
# workflow_dispatch (which adds a manual "Run workflow" button in GitHub UI)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:


concurrency:
  # Runs are grouped by branch/ref
  group: ci-${{ github.ref }}
  # If I push twice in quick succcession to same branch, 
  # oder-in-progress run is cancelled
  cancel-in-progress: true

jobs:
  # A single job `check` is ru non a fresh Ubuntu VM with 30 min timeout.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Variables to pass to environment
    env:
      # torch resolves to the CUDA build by default, which is ~2.5 GB of wheels for a job that
      # only ever runs forward passes on tiny tensors.
      UV_TORCH_BACKEND: cpu

    steps:
      # Syntax here. uses runs pre-packaged action. Alternative is `run` (see below).
      # Reference format for `uses: ` is {owner}/{repo}@{ref}
        # actions: the GitHub org/user that owns the repo; 
        # checkout is repository name; 
        # and @v4 is a git ref: a tag, branch or commit to pin to
        # This clones the repo onto a runner
      - uses: actions/checkout@v4

      # Installs uv
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # reachy-mini depends on pygobject on Linux only (elsewhere it takes the prebuilt
      # gstreamer-bundle wheel), so none of this is visible on a Windows/macOS dev machine.
      # pygobject and pycairo are also the only two entries in the lock with no wheels at all:
      # they build from source and need the cairo + gobject-introspection headers. The gir1.2-*
      # typelibs are a separate, runtime need: `import reachy_mini` reaches media modules that do
      # `gi.require_version("Gst"/"GstApp"/"GstPbutils", "1.0")` at module scope, which the
      # "Every module imports" step below exercises for real.
      - name: System deps for pygobject/GStreamer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2-dev libgirepository1.0-dev \
            gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0

      # --all-groups, not the default: test_speaker.py and test_outro.py import kokoro and the
      # reachy SDK as ordinary libraries. Nothing in the suite touches hardware or the network.
      - name: Install
        # --frozen makes installation process very fast by just
        # deferring to current lockfile rather than trying to 
        # resolve dependencies
        run: uv sync --all-groups --frozen

      # This runs ruff on src tests and demo folders
      # In pyproject.toml ruff is listed as a dependency in the dev group.
      - name: Lint
        # Should this include --group dev? Reason: dev is default uv run group.
        run: uv run ruff check src tests demo

      # The single highest-value check for a repo that has just been renamed and re-laid-out: a
      # broken import path is invisible to the tests that do not happen to import that module.
      # No __main__ guard fires under import and @hydra.main only decorates, so this is safe.
      - name: Every module imports
        run: |
          uv run python - <<'PY'
          import importlib, pkgutil, chess_commentator as p
          bad = []
          for m in pkgutil.walk_packages(p.__path__, p.__name__ + "."):
              try:
                  importlib.import_module(m.name)
              except Exception as e:
                  bad.append(f"{m.name}: {e!r}")
          print("\n".join(bad) or "all modules import OK")
          raise SystemExit(1 if bad else 0)
          PY

      # Docs and error strings advertise ~12 `python -m` entry points. A restructure silently
      # invalidates them: nothing imports a docstring, so nothing else would ever notice.
      - name: Documented `python -m` targets resolve
        run: |
          uv run python - <<'PY'
          import importlib.util, re, subprocess
          mods = set()
          for f in subprocess.check_output(["git", "ls-files"], text=True).split():
              if f.endswith((".png", ".safetensors", ".csv")):
                  continue
              try:
                  text = open(f, encoding="utf-8", errors="ignore").read()
              except OSError:
                  continue
              mods |= set(re.findall(r"python -m ([A-Za-z_][\w.]*)", text))
          missing = [m for m in sorted(mods) if importlib.util.find_spec(m) is None]
          print(f"checked {len(mods)} targets -> missing: {missing or 'none'}")
          raise SystemExit(1 if missing else 0)
          PY

      # The data-dependent modules skip themselves here: data/ is gitignored and ~19 GB.
      # -q "quiets" pytest, i.e. makes output less verbose.
      - name: Tests
        run: uv run pytest -q

      # hatchling cannot infer the package dir (import name != distribution name), so the wheel
      # contents are a real failure mode rather than a formality. cnn/config.yaml must ship too
      # or Hydra has nothing to load.
      # Context: 
        # a wheel (.whl) is Python's standard built, installable package format
        # it has a specific internal layout and a .dist-info/ directory containing metadata
        # (name, version, dependencies, entry points).
        # `pip install some-package` -> pip downloads a whell and unpacks it into
        # site-packages/ - no compiling or running setup scripts. That's the point of
        # wheels: they are install-ready artifacts.
        # uv build turns a source tree into that zip file using whatever is declared as the 
        # build backend, in this case hatchling. (see pyproject.toml)
      # Building wheel is necessary to e.g. upload to PyPI;
      # right now, the build is only a correctness check.
      - name: Build
        run: |
          uv build
          uv run python - <<'PY'
          import glob, zipfile
          wheel = sorted(glob.glob("dist/*.whl"))[-1]
          names = zipfile.ZipFile(wheel).namelist()
          tops = sorted({n.split("/")[0] for n in names})
          assert tops == ["chess_commentator", "robot_chess_commentator-0.1.0.dist-info"], tops
          assert any(n.endswith("cnn/config.yaml") for n in names), "Hydra config missing from wheel"
          print(f"{wheel}: {tops}, hydra config present")
          PY
  